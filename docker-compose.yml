services:
  gateway:
    build: .
    ports:
      - "3200:3200"
    environment:
      - DATABASE_URL=postgresql://bible:${POSTGRES_PASSWORD:-bible}@postgres:5432/praytify_bible
      - DATABASE_SCHEMA=platform
      - BIBLE_API_URL=http://bible-api:3100
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-secret}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3200}
      - PORTAL_URL=${PORTAL_URL:-http://localhost:5173}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - PORT=3200
    depends_on:
      postgres:
        condition: service_healthy
      bible-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.praytify.bible`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"

  # NOTE: For Dokploy, bible-api and gateway are deployed as separate services
  # pointing to separate repos. This docker-compose is for LOCAL DEV only.
  bible-api:
    build:
      context: ../open-bible-api
    expose:
      - "3100"
    environment:
      - DATABASE_URL=postgresql://bible:${POSTGRES_PASSWORD:-bible}@postgres:5432/praytify_bible
      - DATABASE_SCHEMA=bible
      - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bible
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bible}
      - POSTGRES_DB=praytify_bible
    volumes:
      - bible_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d praytify_bible"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bible_data:
