name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  gateway:
    name: Gateway (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  gateway-integration:
    name: Gateway (Postgres integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the production major version.
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  packages:
    name: ${{ matrix.package }} package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, embed]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/${{ matrix.package }}/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: packages/${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  portal:
    name: Portal (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: portal/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            portal/pnpm-lock.yaml
            packages/embed/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The build compiles the embed widget (scripts/copy-embed.mjs) with the
      # embed package's own TypeScript; that package is its own workspace root.
      - run: pnpm install --frozen-lockfile
        working-directory: packages/embed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  audit:
    name: Dependency audit (production, high and critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --prod --audit-level high
        working-directory: portal

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [gateway, portal]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Portal image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: portal/Dockerfile
          push: false
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
