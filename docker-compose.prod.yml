## Praytify Bible — Production Docker Compose (Dokploy)
##
## Architecture:
##   praytify.bible     → portal (static frontend, port 80)
##   api.praytify.bible → gateway (public API, port 3200)
##   bible-engine       → internal only (raw Bible data, port 3100, NOT exposed)
##   postgres           → internal only (database)
##
## Required env vars in Dokploy:
##   PORTAL_DOMAIN        — e.g. praytify.bible
##   GATEWAY_DOMAIN       — e.g. api.praytify.bible
##   POSTGRES_PASSWORD    — database password
##   BETTER_AUTH_SECRET   — auth secret key
##   ADMIN_TOKEN          — admin API token
##   GITHUB_CLIENT_ID     — GitHub OAuth
##   GITHUB_CLIENT_SECRET — GitHub OAuth
##   GOOGLE_CLIENT_ID     — Google OAuth
##   GOOGLE_CLIENT_SECRET — Google OAuth

services:
  gateway:
    image: novashock/praytify-bible-gateway:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bible}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praytify_bible}
      - BIBLE_API_URL=http://bible-engine:3100
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://${GATEWAY_DOMAIN}
      - PORTAL_URL=https://${PORTAL_DOMAIN}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PORT=3200
    depends_on:
      postgres:
        condition: service_healthy
      bible-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-gateway.rule=Host(`${GATEWAY_DOMAIN}`)
      - traefik.http.routers.bible-gateway.entrypoints=websecure
      - traefik.http.routers.bible-gateway.tls.certresolver=letsencrypt
      - traefik.http.services.bible-gateway.loadbalancer.server.port=3200
    networks:
      - dokploy-network
      - internal

  bible-engine:
    image: novashock/praytify-bible-engine:latest
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bible}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praytify_bible}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - PORT=3100
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  portal:
    image: novashock/praytify-bible-portal:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-portal.rule=Host(`${PORTAL_DOMAIN}`)
      - traefik.http.routers.bible-portal.entrypoints=websecure
      - traefik.http.routers.bible-portal.tls.certresolver=letsencrypt
      - traefik.http.services.bible-portal.loadbalancer.server.port=80
    networks:
      - dokploy-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bible}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-praytify_bible}
    volumes:
      - bible_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bible} -d ${POSTGRES_DB:-praytify_bible}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  bible_data:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
