## Praytify Bible — Production Docker Compose (Dokploy)
##
## Architecture:
##   praytify.bible     → portal (static frontend, port 80)
##   api.praytify.bible → gateway (public API + auth, port 3200)
##   bible-engine       → internal only (raw Bible data, port 3100, NOT exposed)
##
## Database: Uses an external Postgres. The bible-engine and gateway both
## need DATABASE_URL pointing to a database with the Bible data already seeded.
## The gateway also creates its own auth tables (better-auth) in the same database.
##
## Required env vars in Dokploy:
##   PORTAL_DOMAIN          — e.g. praytify.bible
##   GATEWAY_DOMAIN         — e.g. api.praytify.bible
##   DATABASE_URL           — Full Postgres connection string (external DB)
##   BETTER_AUTH_SECRET     — auth secret key
##   ADMIN_TOKEN            — admin API token for bible-engine
##   GITHUB_CLIENT_ID       — GitHub OAuth (optional)
##   GITHUB_CLIENT_SECRET   — GitHub OAuth (optional)
##   GOOGLE_CLIENT_ID       — Google OAuth (optional)
##   GOOGLE_CLIENT_SECRET   — Google OAuth (optional)

services:
  gateway:
    image: novashock/praytify-bible-gateway:latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BIBLE_API_URL=http://bible-engine:3100
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://${GATEWAY_DOMAIN}
      - PORTAL_URL=https://${PORTAL_DOMAIN}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PORT=3200
    depends_on:
      bible-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-gateway.rule=Host(`${GATEWAY_DOMAIN}`)
      - traefik.http.routers.bible-gateway.entrypoints=websecure
      - traefik.http.routers.bible-gateway.tls.certresolver=letsencrypt
      - traefik.http.services.bible-gateway.loadbalancer.server.port=3200
    networks:
      - dokploy-network
      - internal

  bible-engine:
    image: novashock/praytify-bible-engine:latest
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - PORT=3100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  portal:
    image: novashock/praytify-bible-portal:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:80').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-portal.rule=Host(`${PORTAL_DOMAIN}`)
      - traefik.http.routers.bible-portal.entrypoints=websecure
      - traefik.http.routers.bible-portal.tls.certresolver=letsencrypt
      - traefik.http.services.bible-portal.loadbalancer.server.port=80
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
