## Praytify Bible — Production Docker Compose (Dokploy)
##
## Architecture:
##   praytify.bible     → portal (static frontend, nginx, port 80)
##   api.praytify.bible → gateway (public API + auth, port 3200)
##   bible-engine       → internal only (raw Bible data, port 3100, NOT exposed)
##
## Database: Bundled Postgres instance with persistent volume.
##
## Optional env vars — set as SERVICE-LEVEL env vars in Dokploy UI on gateway:
##     GITHUB_CLIENT_ID       — GitHub OAuth
##     GITHUB_CLIENT_SECRET   — GitHub OAuth
##     GOOGLE_CLIENT_ID       — Google OAuth
##     GOOGLE_CLIENT_SECRET   — Google OAuth

services:
  gateway:
    image: novashock/praytify-bible-gateway:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bible:praytify2024@postgres:5432/praytify_bible
      BIBLE_API_URL: http://bible-engine:3100
      BETTER_AUTH_SECRET: d2dde4370bf395799399f7e070e5cbed3bcc417a8ed62f92fb862f084280b760
      BETTER_AUTH_URL: https://api.praytify.bible
      PORTAL_URL: https://praytify.bible
      PORT: "3200"
    depends_on:
      postgres:
        condition: service_healthy
      bible-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-gateway.rule=Host(`api.praytify.bible`)
      - traefik.http.routers.bible-gateway.entrypoints=websecure
      - traefik.http.routers.bible-gateway.tls.certresolver=letsencrypt
      - traefik.http.services.bible-gateway.loadbalancer.server.port=3200
    networks:
      - dokploy-network
      - internal

  bible-engine:
    image: novashock/praytify-bible-engine:latest
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      DATABASE_URL: postgresql://bible:praytify2024@postgres:5432/praytify_bible
      ADMIN_TOKEN: ae8f674bd00dcb149ca9f2de1addddb1
      PORT: "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: praytify2024
      POSTGRES_DB: praytify_bible
    volumes:
      - bible_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d praytify_bible"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  portal:
    image: novashock/praytify-bible-portal:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-portal.rule=Host(`praytify.bible`)
      - traefik.http.routers.bible-portal.entrypoints=websecure
      - traefik.http.routers.bible-portal.tls.certresolver=letsencrypt
      - traefik.http.services.bible-portal.loadbalancer.server.port=80
    networks:
      - dokploy-network

volumes:
  bible_data:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
