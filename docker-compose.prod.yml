## Praytify Bible — Production Docker Compose (Dokploy)
##
## Architecture:
##   praytify.bible     → portal (static frontend, nginx, port 80)
##   api.praytify.bible → gateway (public API + auth, port 3200)
##   bible-engine       → internal only (raw Bible data, port 3100, NOT exposed)
##
## Database: Bundled Postgres instance with persistent volume.
##
## Required env vars — set in Dokploy environment section:
##   DATABASE_URL, BETTER_AUTH_SECRET, ADMIN_TOKEN, POSTGRES_PASSWORD
##   Optional: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET

services:
  gateway:
    image: novashock/praytify-bible-gateway:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${{environment.DATABASE_URL}}
      BIBLE_API_URL: http://bible-engine:3100
      BETTER_AUTH_SECRET: ${{environment.BETTER_AUTH_SECRET}}
      BETTER_AUTH_URL: https://api.praytify.bible
      PORTAL_URL: https://praytify.bible
      GITHUB_CLIENT_ID: ${{environment.GITHUB_CLIENT_ID}}
      GITHUB_CLIENT_SECRET: ${{environment.GITHUB_CLIENT_SECRET}}
      GOOGLE_CLIENT_ID: ${{environment.GOOGLE_CLIENT_ID}}
      GOOGLE_CLIENT_SECRET: ${{environment.GOOGLE_CLIENT_SECRET}}
      PORT: "3200"
    depends_on:
      postgres:
        condition: service_healthy
      bible-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-gateway.rule=Host(`api.praytify.bible`)
      - traefik.http.routers.bible-gateway.entrypoints=websecure
      - traefik.http.routers.bible-gateway.tls.certresolver=letsencrypt
      - traefik.http.services.bible-gateway.loadbalancer.server.port=3200
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.bible-gateway.rule=Host(`api.praytify.bible`)
        - traefik.http.routers.bible-gateway.entrypoints=websecure
        - traefik.http.routers.bible-gateway.tls.certresolver=letsencrypt
        - traefik.http.services.bible-gateway.loadbalancer.server.port=3200
    networks:
      - dokploy-network
      - internal

  bible-engine:
    image: novashock/praytify-bible-engine:latest
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      DATABASE_URL: ${{environment.DATABASE_URL}}
      ADMIN_TOKEN: ${{environment.ADMIN_TOKEN}}
      PORT: "3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: ${{environment.POSTGRES_PASSWORD}}
      POSTGRES_DB: praytify_bible
    volumes:
      - bible_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d praytify_bible"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  portal:
    image: novashock/praytify-bible-portal:latest
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.bible-portal.rule=Host(`praytify.bible`)
      - traefik.http.routers.bible-portal.entrypoints=websecure
      - traefik.http.routers.bible-portal.tls.certresolver=letsencrypt
      - traefik.http.services.bible-portal.loadbalancer.server.port=80
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.bible-portal.rule=Host(`praytify.bible`)
        - traefik.http.routers.bible-portal.entrypoints=websecure
        - traefik.http.routers.bible-portal.tls.certresolver=letsencrypt
        - traefik.http.services.bible-portal.loadbalancer.server.port=80
    networks:
      - dokploy-network

volumes:
  bible_data:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
