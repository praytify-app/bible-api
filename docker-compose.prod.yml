## Praytify Bible — Production Docker Compose
## For Dokploy deployment. Images are pre-built and pushed to Docker Hub.
##
## Required: copy .env.production and fill in all values before deploying.
## Run: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

services:
  gateway:
    image: novashock/praytify-bible-gateway:latest
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bible}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praytify_bible}
      - BIBLE_API_URL=http://bible-api:3100
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://api.praytify.bible}
      - PORTAL_URL=${PORTAL_URL:-https://praytify.bible}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PORT=3200
    depends_on:
      postgres:
        condition: service_healthy
      bible-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bible-gateway.rule=Host(`api.praytify.bible`)"
      - "traefik.http.routers.bible-gateway.entrypoints=websecure"
      - "traefik.http.routers.bible-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.bible-gateway.loadbalancer.server.port=3200"

  bible-api:
    image: novashock/praytify-bible-api:latest
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bible}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-praytify_bible}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - PORT=3100
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bible}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-praytify_bible}
    volumes:
      - bible_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bible} -d ${POSTGRES_DB:-praytify_bible}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bible_data:
