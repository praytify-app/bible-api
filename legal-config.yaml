security:
  has_appropriate_measures: true
  controls:
  - All traffic to the website and API is encrypted with TLS, and browsers are told to use HTTPS only (HSTS)
  - API keys are stored only as SHA-256 hashes; the full key is shown to you once
  - Sessions use HttpOnly cookies, and a strict Content Security Policy is applied to the website
  - Rate limits and request size limits protect the service from abuse
  - Services run in containers without root privileges and with read-only file systems
  - '[TBD: confirm encryption at rest on the production server, backup practice, and incident response process]'
  breach_notification_understood: true
cookies:
  uses_cookies: true
  uses_google_maps: false
  categories:
    strictly_necessary:
    - name: better-auth.session_token (named __Secure-better-auth.session_token over HTTPS)
      provider: Praytify Bible
      purpose: Keeps you signed in to the developer dashboard
      duration: 30 days, renewed while you use it
    - name: better-auth.state
      provider: Praytify Bible
      purpose: Ties a GitHub or Google sign-in attempt to your browser to prevent forgery
      duration: About 10 minutes, during sign-in only
    functional:
    - name: pb-theme (local storage)
      provider: Praytify Bible
      purpose: Remembers your light or dark theme choice
      duration: Until you clear it
    - name: pb-reader-settings (local storage)
      provider: Praytify Bible
      purpose: Remembers your reading preferences, such as text size and verse numbers
      duration: Until you clear it
    - name: pb-reader-last (local storage)
      provider: Praytify Bible
      purpose: Remembers the last chapter you read so the reader can resume
      duration: Until you clear it
