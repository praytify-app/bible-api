# Portal static site. __API_ORIGIN__ is replaced at image build time with the
# origin of VITE_API_URL, the same value baked into the JavaScript bundle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative Location headers: behind the TLS proxy nginx only knows its own
    # http scheme and port, so absolute redirects would point at the wrong URL.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Applied to every response that does not set its own headers below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' __API_ORIGIN__; frame-src __API_ORIGIN__; frame-ancestors 'none'; base-uri 'none'; form-action 'self' __API_ORIGIN__; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Hashed build output never changes, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The embed script is loaded as a cross-origin module from other sites,
    # which browsers only allow with CORS. Its URL is stable (v1), so it gets
    # a short cache and revalidates.
    # /embed/ is the embed directory; the builder page lives at /embed.
    location = /embed/ {
        return 301 /embed;
    }

    location /embed/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Single-page app: every other path renders index.html, which must
    # always revalidate so a deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' __API_ORIGIN__; frame-src __API_ORIGIN__; frame-ancestors 'none'; base-uri 'none'; form-action 'self' __API_ORIGIN__; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # No $uri/: public/embed/ is a real directory, and matching it would
        # answer a hard load of /embed with a 403 instead of the app.
        try_files $uri /index.html;
    }
}
